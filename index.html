<!doctype html>
<html lang="id" data-theme="light" data-lang-src="lang.json">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title data-i18n="p.title">Tools SagalaIT</title>
<meta name="description" content="Kumpulan tool kecil untuk pekerjaan harian. Semua berjalan di browser." data-i18n-attr="content:p.meta">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%232447D6'/%3E%3Ctext x='16' y='23' font-family='Arial' font-weight='800' font-size='20' text-anchor='middle' fill='%23fff'%3ES%3C/text%3E%3C/svg%3E">
<script src="assets/theme.js"></script>
<script src="assets/i18n.js"></script>
<link rel="stylesheet" href="assets/app.css">
<link rel="stylesheet" href="portal.css">
</head>
<body class="portal">

<header class="wrap top">
  <a class="brand" href="./" aria-label="Tools SagalaIT, beranda" data-i18n-attr="aria-label:common.home"><span class="logo" aria-hidden="true">S</span>SagalaIT</a>
  <span class="top-end">
    <button class="p-search-btn" id="btnSearch" type="button" aria-haspopup="dialog" aria-label="Cari tool" data-i18n-attr="aria-label:p.search_aria"><span data-i18n="p.search">Cari</span> <kbd class="ui-kbd hint" id="kbdMain" aria-hidden="true"></kbd></button>
    <a class="top-link" href="v1/" data-i18n="common.old">Tampilan lama</a>
    <button class="icon-btn" type="button" data-theme-toggle aria-label="Ganti tema terang atau gelap" data-i18n-attr="aria-label:common.theme">
      <svg width="20" height="20" viewBox="-11 -11 22 22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle r="9"/><path d="M0 -9 A9 9 0 0 1 0 9 Z" fill="currentColor"/></svg>
    </button>
  </span>
</header>

<main class="wrap p-main">
  <div class="panels" id="panels" aria-live="polite"><p class="p-notice" data-i18n="p.loading">Memuat daftar tool…</p></div>
  <noscript><p class="p-notice">Halaman ini membutuhkan JavaScript untuk membaca <code>tools.json</code>.</p></noscript>
</main>

<button class="m-bar" id="mBar" type="button" aria-haspopup="dialog"><span id="mBarText" data-i18n="p.search_aria">Cari tool</span></button>

<footer class="wrap p-foot">
  <span id="footL">sagalait.cloud</span>
  <span><span data-i18n="p.f_press">Tekan</span> <kbd class="ui-kbd" id="hintKey"></kbd> <span data-i18n="p.f_or">atau</span> <kbd class="ui-kbd">/</kbd> <span data-i18n="p.f_search">untuk mencari</span></span>
</footer>

<div class="srch" id="srch" hidden>
  <div class="srch-box" role="dialog" aria-modal="true" aria-label="Cari tool" data-i18n-attr="aria-label:p.search_aria">
    <div class="srch-in">
      <span id="srchIcon" aria-hidden="true"></span>
      <input id="q" type="search" role="combobox" aria-expanded="true" aria-controls="srchList" aria-autocomplete="list" placeholder="Cari tool" aria-label="Cari tool" data-i18n-attr="placeholder:p.search_aria,aria-label:p.search_aria" spellcheck="false" autocomplete="off" autocapitalize="off" enterkeyhint="go">
      <kbd class="ui-kbd" aria-hidden="true">Esc</kbd>
      <button class="srch-cancel" id="btnCancel" type="button" data-i18n="p.cancel">Batal</button>
    </div>
    <div class="srch-count" id="srchCount" aria-live="polite"></div>
    <ul class="srch-list" id="srchList" role="listbox" aria-label="Hasil pencarian" data-i18n-attr="aria-label:p.results_aria"></ul>
    <div class="srch-foot"><span><kbd class="ui-kbd">↑↓←→</kbd> <span data-i18n="p.f_pick">pilih</span> <kbd class="ui-kbd">Enter</kbd> <span data-i18n="p.f_open">buka</span></span><span data-i18n="p.f_match">Cocok dengan nama, deskripsi, dan tag</span></div>
  </div>
</div>

<script src="portal.js"></script>
</body>
</html>
